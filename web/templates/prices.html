{{range .}}
<div class="price-card" role="listitem">
    <div class="token-icon-wrap">
        <img src="{{.ImageURL}}" alt="{{.Pair}} token icon" loading="lazy" />
    </div>
    <div class="card-data">
        <strong>{{.Pair}}</strong>
        <p>{{.CurrencySymbol}}{{.Price}}</p>
        <small>↻ {{.LastUpdate}}</small>
    </div>
</div>
{{end}}
