<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Chainlink Price Feed — preços de criptoativos em tempo real via Chainlink oracles, construído com Go." />
  <title>Chainlink Price Feed · Go</title>

  <link rel="stylesheet" href="styles/fonts.css" />
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/animations.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/header.css" />
  <link rel="stylesheet" href="styles/cards.css" />
  <link rel="stylesheet" href="styles/skeleton.css" />
  <link rel="stylesheet" href="styles/overlay.css" />
  <link rel="stylesheet" href="styles/footer.css" />

  <script src="https://unpkg.com/htmx.org@1.9.10" defer></script>
</head>

<body>
  <div id="feedback-overlay" class="feedback-overlay" role="dialog" aria-live="polite" aria-label="Carregando">
    <div class="feedback-content">
      <div class="spinner" aria-hidden="true"></div>
      <h2>Iniciando serviços</h2>

    </div>
  </div>

  <header id="header">
    <section class="container header-content">
      <div class="header-content-title">
        <div class="header-logo-wrap">
          <img src="../assets/gopher.svg" alt="Go Gopher logo" />
        </div>
        <div>
          <h1>Chainlink Price Feed</h1>
          <span class="header-badge">LIVE · Powered by Oracles</span>
        </div>
      </div>

      <div class="controls">
        <a id="github-link" title="Ver código no GitHub" href="https://github.com/dev-araujo/chainlink-price-feed"
          target="_blank" rel="noopener noreferrer" aria-label="Ver repositório no GitHub">
          <img src="../assets/github-logo.svg" alt="" aria-hidden="true" />
        </a>

        <label for="currency-select" class="sr-only">Selecionar moeda</label>
        <select id="currency-select" name="currency" aria-label="Moeda de exibição" hx-get="/prices/all/brl"
          hx-trigger="change" hx-target="#price-list-container" hx-swap="innerHTML" hx-indicator="#loading-indicator">
          <option value="brl">BRL</option>
          <option value="usd">USD</option>
        </select>
      </div>
    </section>
  </header>

  <main id="main">
    <div class="container">
      <div class="section-header">
        <span class="section-label">Preços de Ativos</span>
        <div class="section-divider" aria-hidden="true"></div>
      </div>

      <div id="price-list-container" class="price-list" hx-get="/ready" hx-trigger="load" hx-swap="outerHTML"
        hx-indicator="#loading-indicator" role="list" aria-label="Lista de preços"></div>

      <div id="loading-indicator" class="skeleton-list htmx-indicator" aria-hidden="true">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
    </div>
  </main>

  <footer class="page-footer">
    <div class="container">
      <p>
        Built with
        <a href="https://golang.org" target="_blank" rel="noopener">Go</a>
        ·
        <a href="https://chain.link" target="_blank" rel="noopener">Chainlink</a>
        ·
        <a href="https://htmx.org" target="_blank" rel="noopener">HTMX</a>
      </p>
    </div>
  </footer>

  <script>
    const feedbackOverlay = document.getElementById('feedback-overlay');

    document.body.addEventListener('htmx:xhr:loadstart', () => {
      feedbackOverlay.classList.add('active');
    });

    document.body.addEventListener('htmx:xhr:loadend', () => {
      feedbackOverlay.classList.remove('active');
    });
    document.body.addEventListener('htmx:responseError', () => {
      feedbackOverlay.classList.remove('active');
    });

    document.body.addEventListener('htmx:configRequest', (evt) => {
      const trigger = evt.detail.triggeringEvent;
      if (trigger && trigger.target.id === 'currency-select') {
        const currency = trigger.target.value;
        evt.detail.path = `/prices/all/${currency}`;
      }
    });
  </script>
</body>

</html>
